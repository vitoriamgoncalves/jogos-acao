<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Action Core</title>

    <style>
    @import url('https://fonts.googleapis.com/css2?family=Boldonse&family=Jersey+25&family=Mozilla+Text:wght@200..700&display=swap');
      
    body{
          margin: 0;
          font-family: Arial, Helvetica, sans-serif;
          background-color: #0A0A0A;
          display: flex; 
          justify-content: center; 
          align-items: center; 
          height: 100vh; 
        }

       .login{
           background-color: #2b2a2a;
           width: 450px;
           padding: 30px;
           border-radius: 15px; 
           box-shadow: 0 0 15px #E50914; 
           text-align: center;
        }

        h1{
            color: #E50914;
            font-family: "Jersey 25", sans-serif;
            font-weight: 400;
            font-style: normal;
            font-size: 55px;
        }

        p{
            color: white;
            font-size: 30px;
        }

        input{
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: none; 
            border-radius: 8px; 
            box-sizing: border-box;
        }

        button{
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #E50914;
            font-weight: bold;
            cursor: pointer;
            font-size: 25px;
        }

        button:hover{
            background: #ce0c16;
        }

        a{
            text-decoration: none;
            color: #fb0e1a;
        }

        .criar{
            font-size: 20px;
        }

    </style>

</head>

<body>

    <div class="login">

    <h1>Action Core💥</h1>
    <p>Entre na sua conta</p>

    <form action="home.html">
    <input type="email" placeholder=" Digite seu e-mail">

    <input type="password" placeholder=" Digite sua senha">
     
    <button type="submit"> Entrar</button>

    </form>
     
    <p> 
     <a href="#"> Criar Conta</a>
    </p>

    </div>
    
</body>
</html>
